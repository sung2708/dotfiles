# ─────────────────────────────────────────────────────────────────────────────
# ~/.tmux.conf — WezTerm + Neovim + Catppuccin Mocha
# Reload: prefix + r      Install/update plugins: prefix + I / prefix + U
# ─────────────────────────────────────────────────────────────────────────────

# ── Prefix ──────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# ── Terminal: true colour, undercurl, Neovim ────────────────────────────────
# tmux-256color gives italics and correct key handling, but older macOS
# system ncurses lacks it; fall back to screen-256color there (see the note
# at the end of this file to install it).
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -as terminal-features ',*:RGB'        # 24-bit colour from WezTerm
set -as terminal-features ',*:usstyle'    # undercurl + coloured underlines (LSP)
set -as terminal-features ',xterm*:extkeys'
set -s extended-keys on                   # Ctrl/Alt combos Neovim can tell apart
set-environment -g COLORTERM truecolor    # programs inside tmux use 24-bit colour

set -sg escape-time 10                    # Esc leaves Insert instantly (sensible's 0 can garble keys)
set -g focus-events on                    # Neovim autoread / FocusGained
set -s set-clipboard on                   # OSC 52: copies reach the macOS clipboard
set -g allow-passthrough on               # images in yazi/Neovim
set -ga update-environment 'TERM TERM_PROGRAM'

# ── General ─────────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string '#S · #W'
set -g detach-on-destroy off              # closing a session switches to another one
set -g display-time 2000
set -g status-interval 5

# ── Windows and panes (keep the current directory) ──────────────────────────
unbind %
unbind '"'
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z

# Alt+h/j/k/l: move between tmux panes. Inside Neovim the keys go to Neovim,
# which already uses Alt+h/j/k/l to move between its own windows.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n M-h if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind -n M-j if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind -n M-k if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind -n M-l if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

# ── Copy mode (vi keys, copies to the macOS clipboard) ──────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'pbcopy'

# ── Theme: Catppuccin Mocha (matches WezTerm, Neovim, fzf, bat) ─────────────
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background 'none'      # transparent bar
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W#{?window_zoomed_flag, 󰁌,}'
set -g @catppuccin_directory_text ' #{b:pane_current_path}'

if-shell 'test -f ~/.tmux/plugins/tmux/catppuccin.tmux' \
  'run ~/.tmux/plugins/tmux/catppuccin.tmux'

set -g status-position bottom
set -g status-left-length 100
set -g status-right-length 100
set -g status-left '#{E:@catppuccin_status_session} '
set -g status-right '#{E:@catppuccin_status_directory}'
set -agF status-right '#{E:@catppuccin_status_battery}'

# Previous theme (Tokyo Night) — to go back, replace 'catppuccin/tmux' below
# with 'janoamaral/tokyo-night-tmux', delete the Catppuccin block above and
# restore these options:
#   set -g @tokyo-night-tmux_theme 'storm'
#   set -g @tokyo-night-tmux_transparent 1
#   set -g @tokyo-night-tmux_show_music 1
#   set -g @tokyo-night-tmux_show_battery_widget 1

# ── Plugins (TPM) ───────────────────────────────────────────────────────────
set-environment -g PATH "/opt/local/bin:/opt/local/sbin:/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.3.2'
set -g @plugin 'tmux-plugins/tmux-battery'

# Install TPM and the plugins automatically on a new machine.
if-shell 'test ! -d ~/.tmux/plugins/tpm' \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Keep this at the very bottom.
run '~/.tmux/plugins/tpm/tpm'

# Note: if `infocmp tmux-256color` fails on macOS, install the entry once:
#   /opt/local/bin/infocmp -x tmux-256color > /tmp/tmux.ti && tic -x /tmp/tmux.ti
